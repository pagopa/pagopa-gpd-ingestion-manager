# Info
info.application.artifactId=@project.artifactId@
info.application.name=@project.name@
info.application.version=@project.version@
info.application.description=@project.description@
info.properties.environment=azure
# Actuator
management.endpoints.web.exposure.include=health,info
management.endpoints.jmx.exposure.include=health,info
management.info.env.enabled=true
management.endpoint.health.probes.enabled=true
management.health.livenessState.enabled=true
management.health.readinessState.enabled=true
# Openapi
springdoc.writer-with-order-by-keys=true
springdoc.writer-with-default-pretty-printer=true
# Server
server.servlet.context-path=/
server.port=8080
server.shutdown=GRACEFUL
# Logging
logging.level.root=INFO
logging.level.it.gov.pagopa=INFO
# CORS configuration
cors.configuration={"origins": ["*"], "methods": ["*"]}
# Jackson serialization
spring.jackson.default-property-inclusion=NON_NULL
spring.jackson.serialization.write-dates-as-timestamps=true
spring.jackson.serialization.fail-on-empty-beans=false
spring.jackson.deserialization.fail-on-unknown-properties=false
spring.jackson.deserialization.read-unknown-values-as-null=true
# EH Kafka Configuration
spring.cloud.function.definition=ingestPaymentPosition;ingestPaymentOption;ingestTransfer
## Kafka Payment Positions
spring.cloud.stream.bindings.ingestPaymentPosition-in-0.destination=cdc-raw-auto.apd.payment_position
spring.cloud.stream.bindings.ingestPaymentPosition-in-0.group=default
spring.cloud.stream.bindings.ingestPaymentPosition-in-0.content-type=application/json
spring.cloud.stream.bindings.ingestPaymentPosition-in-0.binder=payment-position-consumer
spring.cloud.stream.bindings.ingestPaymentPosition-in-0.consumer.batch-mode=true
spring.cloud.stream.binders.payment-position-consumer.type=kafka
spring.cloud.stream.binders.payment-position-consumer.environment.spring.cloud.stream.kafka.binder.brokers=broker
spring.cloud.stream.binders.payment-position-consumer.environment.spring.cloud.stream.kafka.binder.configuration.sasl.jaas.config=org.apache.kafka.common.security.plain.PlainLoginModule required username="$ConnectionString" password="constring";
spring.cloud.stream.binders.payment-position-consumer.environment.spring.cloud.stream.kafka.binder.configuration.key.serializer=org.apache.kafka.common.serialization.StringSerializer
spring.cloud.stream.bindings.ingestPaymentPosition-out-0.destination=gpd-ingestion.apd.payment_position
spring.cloud.stream.bindings.ingestPaymentPosition-out-0.content-type=application/json
spring.cloud.stream.bindings.ingestPaymentPosition-out-0.binder=payment-position-producer
spring.cloud.stream.binders.payment-position-producer.type=kafka
spring.cloud.stream.binders.payment-position-producer.environment.spring.cloud.stream.kafka.binder.brokers=broker
spring.cloud.stream.binders.payment-position-producer.environment.spring.cloud.stream.kafka.binder.configuration.sasl.jaas.config=org.apache.kafka.common.security.plain.PlainLoginModule required username="$ConnectionString" password="constring";
spring.cloud.stream.binders.payment-position-producer.environment.spring.cloud.stream.kafka.binder.configuration.key.serializer=org.apache.kafka.common.serialization.StringSerializer
## Kafka Payment Options
spring.cloud.stream.bindings.ingestPaymentOption-in-0.destination=cdc-raw-auto.apd.payment_option
spring.cloud.stream.bindings.ingestPaymentOption-in-0.group=default
spring.cloud.stream.bindings.ingestPaymentOption-in-0.content-type=application/json
spring.cloud.stream.bindings.ingestPaymentOption-in-0.binder=payment-option-consumer
spring.cloud.stream.bindings.ingestPaymentOption-in-0.consumer.batch-mode=true
spring.cloud.stream.binders.payment-option-consumer.type=kafka
spring.cloud.stream.binders.payment-option-consumer.environment.spring.cloud.stream.kafka.binder.brokers=broker
spring.cloud.stream.binders.payment-option-consumer.environment.spring.cloud.stream.kafka.binder.configuration.sasl.jaas.config=org.apache.kafka.common.security.plain.PlainLoginModule required username="$ConnectionString" password="constring";
spring.cloud.stream.binders.payment-option-consumer.environment.spring.cloud.stream.kafka.binder.configuration.key.serializer=org.apache.kafka.common.serialization.StringSerializer
spring.cloud.stream.bindings.ingestPaymentOption-out-0.destination=gpd-ingestion.apd.payment_option
spring.cloud.stream.bindings.ingestPaymentOption-out-0.content-type=application/json
spring.cloud.stream.bindings.ingestPaymentOption-out-0.binder=payment-option-producer
spring.cloud.stream.binders.payment-option-producer.type=kafka
spring.cloud.stream.binders.payment-option-producer.environment.spring.cloud.stream.kafka.binder.brokers=broker
spring.cloud.stream.binders.payment-option-producer.environment.spring.cloud.stream.kafka.binder.configuration.sasl.jaas.config=org.apache.kafka.common.security.plain.PlainLoginModule required username="$ConnectionString" password="constring";
spring.cloud.stream.binders.payment-option-producer.environment.spring.cloud.stream.kafka.binder.configuration.key.serializer=org.apache.kafka.common.serialization.StringSerializer
## Kafka Transfer
spring.cloud.stream.bindings.ingestTransfer-in-0.destination=cdc-raw-auto.apd.transfer
spring.cloud.stream.bindings.ingestTransfer-in-0.group=default
spring.cloud.stream.bindings.ingestTransfer-in-0.content-type=application/json
spring.cloud.stream.bindings.ingestTransfer-in-0.binder=transfer-consumer
spring.cloud.stream.bindings.ingestTransfer-in-0.consumer.batch-mode=true
spring.cloud.stream.binders.transfer-consumer.type=kafka
spring.cloud.stream.binders.transfer-consumer.environment.spring.cloud.stream.kafka.binder.brokers=broker
spring.cloud.stream.binders.transfer-consumer.environment.spring.cloud.stream.kafka.binder.configuration.sasl.jaas.config=org.apache.kafka.common.security.plain.PlainLoginModule required username="$ConnectionString" password="constring";
spring.cloud.stream.binders.transfer-consumer.environment.spring.cloud.stream.kafka.binder.configuration.key.serializer=org.apache.kafka.common.serialization.StringSerializer
spring.cloud.stream.bindings.ingestTransfer-out-0.destination=gpd-ingestion.apd.transfer
spring.cloud.stream.bindings.ingestTransfer-out-0.content-type=application/json
spring.cloud.stream.bindings.ingestTransfer-out-0.binder=transfer-producer
spring.cloud.stream.binders.transfer-producer.type=kafka
spring.cloud.stream.binders.transfer-producer.environment.spring.cloud.stream.kafka.binder.brokers=broker
spring.cloud.stream.binders.transfer-producer.environment.spring.cloud.stream.kafka.binder.configuration.sasl.jaas.config=org.apache.kafka.common.security.plain.PlainLoginModule required username="$ConnectionString" password="constring";
spring.cloud.stream.binders.transfer-producer.environment.spring.cloud.stream.kafka.binder.configuration.key.serializer=org.apache.kafka.common.serialization.StringSerializer
## Kafka misc
spring.cloud.stream.kafka.binder.auto-create-topics=false
spring.cloud.stream.kafka.binder.configuration.heartbeat.interval.ms=3000
spring.cloud.stream.kafka.binder.configuration.session.timeout.ms=60000
spring.cloud.stream.kafka.binder.configuration.request.timeout.ms=60000
spring.cloud.stream.kafka.binder.configuration.sasl.mechanism=PLAIN
spring.cloud.stream.kafka.binder.configuration.security.protocol=SASL_SSL
spring.cloud.stream.kafka.binder.configuration.connections.max.idle.ms=180000
spring.cloud.stream.kafka.binder.configuration.metadata.max.idle.ms=180000
spring.cloud.stream.kafka.binder.configuration.metadata.max.age.ms=179000
spring.cloud.stream.kafka.binder.configuration.max.request.size=1000000
spring.cloud.stream.kafka.bindings.ingestPaymentPosition-in-0.consumer.ackMode=RECORD
spring.cloud.stream.kafka.bindings.ingestPaymentOption-in-0.consumer.ackMode=RECORD
spring.cloud.stream.kafka.bindings.ingestTransfer-in-0.consumer.ackMode=RECORD
# PDV Tokenizer
pdv.tokenizer.base-path=https://api.uat.tokenizer.pdv.pagopa.it/tokenizer/v1
pdv.tokenizer.sub-key=subkey
pdv.tokenizer.sub-key-header=x-api-key
pdv.tokenizer.create-token.endpoint=/tokens
pdv.tokenizer.retry.initial-interval=200
pdv.tokenizer.retry.multiplier=2.0
pdv.tokenizer.retry.randomization-factor=0.6
pdv.tokenizer.retry.max-retries=3
pdv.tokenizer.placeholderOnPdvKO=false

# Anonymizer
anonymizer.endpoint=https://api.uat.platform.pagopa.it/anonymizer/v1/anonymize
anonymizer.sub-key=subkey
anonymizer.request-id-header=X-Request-Id
anonymizer.sub-key-header=Ocp-Apim-Subscription-Key
anonymizer.retry.initial-interval=200
anonymizer.retry.multiplier=2.0
anonymizer.retry.randomization-factor=0.6
anonymizer.retry.max-retries=3
anonymizer.placeholderOnAnonymizerKO=false

azure.storage.record.limit=500
azure.storage.record.lock.duration=300

# Retry Dead Letter
retry.dead.letter.enabled=true
retry.dead.letter.cron=*/30 * * * * *
retry.dead.letter.retry.max=10
retry.dead.letter.retry.backoff.interval=180
